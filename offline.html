<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <title>Demo Slots</title>
    <style>body{font-family:Arial,Helvetica,sans-serif;padding:16px}ul{line-height:1.6}</style>
  </head>
  <body>
    <h1>Study Slots</h1>
    <ul id="slotsList"></ul>
    <script>
      const ul = document.getElementById('slotsList');
      const slots = window.studyAPI?.getDemoSlots() || [];
      slots.forEach(s => {
        const li = document.createElement('li');
        li.textContent = ${s.start_hm} - min: ;
        ul.appendChild(li);
      });
    </script>
  </body>
</html>
